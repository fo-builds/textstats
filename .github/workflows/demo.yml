name: repopilot-demo

on:
  push:
    branches: [main]
    paths-ignore: ['.github/**']
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write
  models: read

jobs:
  demo:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install RepoPilot from its public repo
        run: pip install -q git+https://github.com/fo-builds/repopilot.git pytest

      - name: Run RepoPilot end to end on issue #1 (offline plan mode)
        env:
          REPOPILOT_PROVIDER: nebius
          REPOPILOT_PLAN_FILE: plan.json
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          python -m repopilot https://github.com/fo-builds/textstats 1 --no-call
          echo '--- result card ---'
          cat out/result_card.json

      - name: List opened PRs
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh pr list --repo fo-builds/textstats --state all --limit 5 || true
        

